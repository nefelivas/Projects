<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Workspace Explorer — Install</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #f8f8f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 48px 40px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
      text-align: center;
    }
    .logo {
      background: #4a154b;
      color: white;
      width: 48px; height: 48px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem;
      font-weight: 700;
      margin: 0 auto 24px;
    }
    h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 10px; }
    p { font-size: 0.9rem; color: #666; margin-bottom: 32px; line-height: 1.6; }
    .slack-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #4a154b;
      color: white;
      padding: 13px 24px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s;
    }
    .slack-btn:hover { background: #611f69; }
    .note { margin-top: 20px; font-size: 0.8rem; color: #999; }
    .user-info { font-size: 0.82rem; color: #888; margin-bottom: 24px; }
    .user-info span { color: #4a154b; font-weight: 600; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">W</div>
  <h1>Connect your Slack workspace</h1>
  <div class="user-info">Signed in as <span id="user-email">...</span></div>
  <p>Click the button below to connect your Slack workspace. You'll be asked to authorize the app and select your workspace.</p>
  <a href="/auth/install" class="slack-btn">
    <svg width="20" height="20" viewBox="0 0 122.8 122.8" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M25.8 77.6c0 7.1-5.8 12.9-12.9 12.9S0 84.7 0 77.6s5.8-12.9 12.9-12.9h12.9v12.9zm6.5 0c0-7.1 5.8-12.9 12.9-12.9s12.9 5.8 12.9 12.9v32.3c0 7.1-5.8 12.9-12.9 12.9s-12.9-5.8-12.9-12.9V77.6z" fill="white"/>
      <path d="M45.2 25.8c-7.1 0-12.9-5.8-12.9-12.9S38.1 0 45.2 0s12.9 5.8 12.9 12.9v12.9H45.2zm0 6.5c7.1 0 12.9 5.8 12.9 12.9s-5.8 12.9-12.9 12.9H12.9C5.8 58.1 0 52.3 0 45.2s5.8-12.9 12.9-12.9h32.3z" fill="white"/>
      <path d="M97 45.2c0-7.1 5.8-12.9 12.9-12.9s12.9 5.8 12.9 12.9-5.8 12.9-12.9 12.9H97V45.2zm-6.5 0c0 7.1-5.8 12.9-12.9 12.9s-12.9-5.8-12.9-12.9V12.9C64.7 5.8 70.5 0 77.6 0s12.9 5.8 12.9 12.9v32.3z" fill="white"/>
      <path d="M77.6 97c7.1 0 12.9 5.8 12.9 12.9s-5.8 12.9-12.9 12.9-12.9-5.8-12.9-12.9V97h12.9zm0-6.5c-7.1 0-12.9-5.8-12.9-12.9s5.8-12.9 12.9-12.9h32.3c7.1 0 12.9 5.8 12.9 12.9s-5.8 12.9-12.9 12.9H77.6z" fill="white"/>
    </svg>
    Add to Slack
  </a>
  <p class="note">You only need to do this once per workspace.</p>
</div>

<script>
  // Check if already logged in
  fetch('/api/auth/me')
    .then(r => r.json())
    .then(data => {
      if (!data.ok) {
        window.location.href = '/login';
        return;
      }
      document.getElementById('user-email').textContent = data.user.email;
      if (data.user.workspace_id) {
        window.location.href = `/dashboard?workspace=${data.user.workspace_id}`;
      }
    });
</script>
</body>
</html>
