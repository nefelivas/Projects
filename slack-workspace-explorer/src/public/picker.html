<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Workspace Explorer — Select Workspace</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #f8f8f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    }
    .logo {
      background: #4a154b;
      color: white;
      width: 40px; height: 40px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 24px;
    }
    h1 { font-size: 1.3rem; font-weight: 700; margin-bottom: 6px; }
    .subtitle { font-size: 0.875rem; color: #666; margin-bottom: 12px; }
    .user-email { font-size: 0.82rem; color: #888; margin-bottom: 28px; }
    .user-email span { color: #4a154b; font-weight: 600; }
    .workspace-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
    .workspace-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s;
      background: white;
      width: 100%;
      font-family: 'DM Sans', sans-serif;
      text-align: left;
    }
    .workspace-btn:hover { border-color: #4a154b; background: #faf5fb; }
    .ws-icon {
      width: 40px; height: 40px;
      background: #4a154b;
      color: white;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .ws-name { font-weight: 700; font-size: 0.95rem; color: #1d1c1d; }
    .ws-sub { font-size: 0.78rem; color: #888; margin-top: 2px; }
    .ws-arrow { margin-left: auto; color: #ccc; font-size: 1rem; }
    .divider { border: none; border-top: 1px solid #f0f0f0; margin: 4px 0 20px; }
    .add-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border: 1px dashed #ccc;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s;
      background: none;
      width: 100%;
      font-family: 'DM Sans', sans-serif;
      color: #666;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .add-btn:hover { border-color: #4a154b; color: #4a154b; background: #faf5fb; }
    .logout-link { text-align: center; font-size: 0.82rem; color: #999; }
    .logout-link a { color: #4a154b; text-decoration: none; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">W</div>
  <h1>Select a workspace</h1>
  <p class="subtitle">Choose which workspace you want to view.</p>
  <p class="user-email">Signed in as <span id="user-email">...</span></p>

  <div class="workspace-list" id="workspace-list">
    <div style="color:#999;font-size:0.85rem">Loading workspaces...</div>
  </div>

  <hr class="divider"/>

  <button class="add-btn" onclick="window.location.href='/install'">
    <span>+</span> Add another workspace
  </button>

  <div class="logout-link">
    <a onclick="logout()">Sign out</a>
  </div>
</div>

<script>
  async function logout() {
    await fetch('/api/auth/logout', { method: 'POST' });
    window.location.href = '/login';
  }

  fetch('/api/auth/me')
    .then(r => r.json())
    .then(data => {
      if (!data.ok) { window.location.href = '/login'; return; }

      document.getElementById('user-email').textContent = data.user.email;
      const workspaces = data.user.workspaces || [];

      if (workspaces.length === 0) {
        window.location.href = '/install';
        return;
      }

      if (workspaces.length === 1) {
        window.location.href = `/dashboard?workspace=${workspaces[0].workspace_id}`;
        return;
      }

      const list = document.getElementById('workspace-list');
      list.innerHTML = workspaces.map(ws => `
        <button class="workspace-btn" onclick="window.location.href='/dashboard?workspace=${ws.workspace_id}'">
          <div class="ws-icon">${ws.team_name.charAt(0).toUpperCase()}</div>
          <div>
            <div class="ws-name">${ws.team_name}</div>
            <div class="ws-sub">Click to open dashboard</div>
          </div>
          <span class="ws-arrow">→</span>
        </button>
      `).join('');
    })
    .catch(() => window.location.href = '/login');
</script>
</body>
</html>
